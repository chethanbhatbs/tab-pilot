<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:900px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif}
.stage{width:1440px;height:900px;display:flex;align-items:center;
  background:linear-gradient(135deg,#eef4ff 0%,#e5edfb 40%,#dbe7fa 100%);position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;width:820px;height:820px;border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,0.16),transparent 70%);top:-220px;right:-160px}
.left{flex:1;padding:0 30px 0 96px;position:relative;z-index:2}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(37,99,235,0.1);color:#2563eb;
  font-weight:600;font-size:15px;padding:8px 16px;border-radius:999px;margin-bottom:26px}
.badge .dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
h1{font-size:54px;line-height:1.08;font-weight:800;color:#0f172a;letter-spacing:-1.5px;margin-bottom:20px}
h1 .accent{color:#2563eb}
.sub{font-size:20px;line-height:1.5;color:#475569;margin-bottom:38px;max-width:540px}
.feat{display:flex;align-items:center;gap:14px;margin-bottom:17px;font-size:17.5px;color:#1e293b;font-weight:500}
.feat .ic{width:34px;height:34px;border-radius:9px;background:#fff;box-shadow:0 3px 10px rgba(15,23,42,0.08);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.right{width:520px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;padding-right:80px}
.frame{background:#fff;border-radius:18px;box-shadow:0 40px 90px rgba(15,23,42,0.30),0 8px 24px rgba(15,23,42,0.12);
  overflow:hidden;width:340px}
.bar{height:36px;background:#f1f5f9;display:flex;align-items:center;gap:7px;padding:0 15px;border-bottom:1px solid #e5e9f0}
.bar span{width:10px;height:10px;border-radius:50%}
.bar .r{background:#ff5f57}.bar .y{background:#febc2e}.bar .g{background:#28c840}
.frame img{display:block;width:340px}
</style></head><body>
